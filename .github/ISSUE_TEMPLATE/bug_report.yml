name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Sprint Kit version
      description: Shown in the app footer, or the release you installed.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Windows desktop app, index.html in a browser, PR sync GitHub Action]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Log or error text
      description: For PR sync, the job log. Remove your Trello key and token before pasting.
      render: text
