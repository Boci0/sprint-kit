name: Sprint Kit release

# Builds the Windows, macOS and Linux installers for Sprint_automation/desktop.
#  - Push a tag like  sprintkit-v0.1.0  -> builds and publishes a GitHub Release with the installers.
#  - Run manually from the Actions tab   -> builds and uploads the installers as workflow artifacts only.
on:
  push:
    tags:
      - 'sprintkit-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Sprint_automation/desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis
            bundle: nsis/*.exe
          - name: macos-arm
            os: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
            target: aarch64-apple-darwin
            bundle: dmg/*.dmg
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
            bundle: appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Sprint_automation/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Sprint_automation/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # tauri-action runs `tauri build` directly, so copy ../index.html into dist/ first
      - name: Sync app files
        run: npm run sync

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: Sprint_automation/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Sprint Kit ${{ github.ref_name }}
          args: ${{ matrix.args }}
          releaseBody: |
            Installers for Sprint Kit for Trello: Windows (`.exe`), macOS (`.dmg`) and Linux (`.AppImage`, `.deb`).
            The installers are not code-signed. Windows shows "Windows protected your PC": click More info, then Run anyway. On macOS, right-click the app and choose Open the first time. On Linux, make the AppImage executable (`chmod +x`) before running it.
            Each person pastes their own Trello API key and token.
          releaseDraft: false
          prerelease: false

      - name: Build installer (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- ${{ matrix.args }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload installer (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sprint-kit-${{ matrix.name }}
          path: Sprint_automation/desktop/src-tauri/target/${{ matrix.target && format('{0}/', matrix.target) || '' }}release/bundle/${{ matrix.bundle }}
