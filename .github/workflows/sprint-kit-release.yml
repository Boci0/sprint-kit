name: Sprint Kit release

# Builds the Windows installer for Sprint_automation/desktop.
#  - Push a tag like  sprintkit-v0.1.0  -> builds and publishes a GitHub Release with the installer.
#  - Run manually from the Actions tab   -> builds and uploads the installer as a workflow artifact only.
on:
  push:
    tags:
      - 'sprintkit-v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: Sprint_automation/desktop

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Sprint_automation/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Sprint_automation/desktop/src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # tauri-action runs `tauri build` directly, so copy ../index.html into dist/ first
      - name: Sync app files
        run: npm run sync

      - name: Build and publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Sprint_automation/desktop
          tagName: ${{ github.ref_name }}
          releaseName: Sprint Kit ${{ github.ref_name }}
          releaseBody: |
            Windows installer for Sprint Kit for Trello.
            Windows may show "Windows protected your PC" because the installer is not code-signed: click More info, then Run anyway.
            Each person pastes their own Trello API key and token.
          releaseDraft: false
          prerelease: false

      - name: Build installer (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build

      - name: Upload installer (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: sprint-kit-windows-installer
          path: Sprint_automation/desktop/src-tauri/target/release/bundle/nsis/*.exe
