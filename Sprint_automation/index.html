<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Kit for Trello</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#172b4d;--mute:#6b778c;--line:#dfe1e6;--accent:#0c66e4;--ok:#1f845a}
@media (prefers-color-scheme:dark){:root{--bg:#1d2125;--card:#22272b;--ink:#dee4ea;--mute:#9fadbc;--line:#38414a;--accent:#579dff;--ok:#4bce97}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.steps{display:flex;gap:8px;margin-bottom:16px}
.steps button{flex:1;padding:10px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer;font:inherit;font-weight:600;text-align:left}
.steps button.on{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.steps b{display:block;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-size:15px;margin:0 0 10px}
label{display:block;font-weight:600;margin:12px 0 3px}
label small{font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:64px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 6px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.mute{color:var(--mute);font-size:13px}
ol.how{margin:0 0 12px;padding-left:20px}
ol.how li{margin:4px 0}
.big{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;margin:8px 0 0;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:220px;overflow:auto}
.foot{margin-top:24px;display:flex;gap:14px;flex-wrap:wrap}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none}
#toast.on{opacity:1}
@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Sprint Kit for Trello</h1>
  <p class="sub">Write your user stories here, then copy them into Trello.</p>
  <div class="steps" id="steps"></div>
  <div id="main"></div>
  <div class="foot">
    <button class="btn link" id="goSetup">First time? Set up the Trello board</button>
    <button class="btn link" id="exp">Save backup</button>
    <label class="btn link" style="margin:0;cursor:pointer">Load backup<input type="file" id="imp" accept=".json" hidden></label>
  </div>
</div>
<div id="toast"></div>

<script>
const KEY='sprintkit.v2';
let S=load(), page='write', editing=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.stories)return d}catch(e){}return{review:'',stories:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1300)}
async function copy(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast('Copied — now paste in Trello');if(btn){btn.classList.add('done');btn.textContent='Copied ✓'}
}
const nextId=()=>'US-'+String((S.stories.reduce((m,s)=>Math.max(m,+s.id.replace(/\D/g,'')||0),0))+1).padStart(2,'0');
const fmt=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';

/* what gets pasted into Trello */
const cardTitle=s=>`${s.id} · ${s.title}${s.points?` [${s.points}]`:''}`;
function cardDesc(s){
  const L=[];
  if(s.role||s.want||s.why)L.push(`**As a** ${s.role||'…'}`,`**I want** ${s.want||'…'}`,`**so that** ${s.why||'…'}`,'');
  const ac=lines(s.ac);
  if(ac.length){L.push('**Acceptance criteria**',...ac.map(a=>'- '+a),'')}
  L.push(`**Priority:** ${s.pri}`);
  if(s.owner)L.push(`**Owner:** ${s.owner}`);
  if(S.review)L.push(`**Due:** sprint Review, ${fmt(S.review)}`);
  return L.join('\n');
}
const cardTasks=s=>(lines(s.tasks).length?lines(s.tasks):lines(s.ac)).join('\n');

/* ---------- pages ---------- */
function render(){
  $('#steps').innerHTML=[['write','Step 1','Write stories'],['copy','Step 2a','Copy to Trello'],['push','Step 2b','Push to Trello']]
    .map(([k,a,b])=>`<button data-p="${k}" class="${page===k?'on':''}"><b>${a}</b>${b}</button>`).join('');
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
  $('#main').innerHTML=({write:pWrite,copy:pCopy,push:pPush,setup:pSetup})[page]();
  bind();
}

function pWrite(){
  const s=editing!==null?S.stories[editing]:{title:'',role:'',want:'',why:'',ac:'',points:'',pri:'Must',tasks:'',owner:''};
  return `
  <div class="panel">
    <h2>${editing!==null?'Edit '+esc(s.id):'Add a story'}</h2>
    <label>Story title <small>short, e.g. “Log in with UNIMAS email”</small></label>
    <input id="f-title" value="${esc(s.title)}">
    <label>Who is it for? <small>e.g. a student</small></label>
    <input id="f-role" value="${esc(s.role)}">
    <label>What do they want to do?</label>
    <input id="f-want" value="${esc(s.want)}">
    <label>Why? <small>the benefit</small></label>
    <input id="f-why" value="${esc(s.why)}">
    <label>How do we know it's done? <small>one line each, e.g. “Given a valid account, when I log in, then I see Home in 2 seconds”</small></label>
    <textarea id="f-ac">${esc(s.ac)}</textarea>
    <div class="two">
      <div><label>Points <small>effort, optional</small></label><input id="f-points" type="number" min="0" value="${esc(s.points)}"></div>
      <div><label>Priority</label><select id="f-pri">${[['Must','Must have'],['Should','Should have'],['Could','Could have'],["Won't","Won't (this time)"]].map(([v,l])=>`<option value="${v}" ${s.pri===v?'selected':''}>${l}</option>`).join('')}</select></div>
    </div>
    <label>Owner <small>who is accountable; use the name or username they have in Trello (comma-separate for more than one)</small></label>
    <input id="f-owner" list="owners" value="${esc(s.owner)}" autocomplete="off">
    <datalist id="owners">${[...new Set([...TB.members.map(m=>m.fullName||m.username),...S.stories.flatMap(x=>String(x.owner||'').split(',').map(n=>n.trim()))].filter(Boolean))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
    <label>Tasks <small>optional,</small> one per line — if empty, the “done” lines are used as the checklist</small></label>
    <textarea id="f-tasks">${esc(s.tasks)}</textarea>
    <div class="big"><button class="btn p" id="save">${editing!==null?'Save changes':'Add story'}</button>${editing!==null?'<button class="btn" id="cancel">Cancel</button>':''}</div>
  </div>
  <div class="panel">
    <h2>Your stories (${S.stories.length})</h2>
    ${S.stories.map((x,i)=>`<div class="item"><div class="grow"><b>${esc(x.id)}</b> ${esc(x.title)}<div class="mute">${esc(x.pri)}${x.points?' · '+x.points+' pts':''}${x.owner?' · '+esc(x.owner):' · no owner'}</div></div>
      <button class="btn link" data-edit="${i}">Edit</button><button class="btn link" data-del="${i}">Delete</button></div>`).join('')||'<p class="mute">Nothing yet. Add your first story above.</p>'}
    ${S.stories.length?'<div class="big"><button class="btn p" data-p="copy">Next: copy to Trello →</button></div>':''}
  </div>
  <div class="panel">
    <h2>Bulk import from text</h2>
    <p class="mute" style="margin-top:0">Paste several stories at once. Separate stories with a blank line. The first line is the title. After that, use any of these lines (all optional):</p>
    <pre>As a student, I want to search clinics, so that I can book faster
points: 3
pri: Must
owner: Alice Tan
ac: Given the Services screen, when I type dental, then matches show in 1 s
ac: Given no matches, when I search, then I see “No results”
tasks: Search box added
tasks: 3 widget tests pass in CI</pre>
    <p class="mute">You can write the story as one “As a …, I want …, so that …” line, or as separate <code>role:</code> <code>want:</code> <code>why:</code> lines. Repeat <code>ac:</code> and <code>tasks:</code> for more lines. <code>pri:</code> is Must, Should, Could or Won't.</p>
    <textarea id="bulk" style="min-height:150px" placeholder="Paste stories here"></textarea>
    <div class="big"><button class="btn p" id="bulk-go">Import stories</button></div>
  </div>`;
}

const PRI_MAP=[[/^m/i,'Must'],[/^s/i,'Should'],[/^c/i,'Could'],[/^w/i,"Won't"]];
function parseStories(text){
  let skipped=0;
  const out=text.split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).map(b=>{
    const s={title:b[0].replace(/^title\s*:\s*/i,'').replace(/^(?:[-*•]|\d+[.)])\s+/,''),role:'',want:'',why:'',ac:'',points:'',pri:'Should',tasks:'',owner:''};
    const ac=[],tk=[];
    b.slice(1).forEach(l=>{
      const sent=l.match(/^as an?\s+(.+?),?\s+i want\s+(.+?),?\s+so that\s+(.+)$/i);
      if(sent){s.role=sent[1];s.want=sent[2];s.why=sent[3];return}
      const m=l.match(/^(role|want|why|benefit|points|pts|pri|priority|owner|ac|done|tasks?|check)\s*:\s*(.*)$/i);
      if(!m){skipped++;return}
      const k=m[1].toLowerCase(),v=m[2].trim();
      if(k==='ac'||k==='done')ac.push(v);
      else if(k==='task'||k==='tasks'||k==='check')tk.push(v);
      else if(k==='pri'||k==='priority'){const p=PRI_MAP.find(([re])=>re.test(v));if(p)s.pri=p[1];else skipped++}
      else if(k==='points'||k==='pts')s.points=v.replace(/\D/g,'');
      else if(k==='benefit')s.why=v;
      else s[k]=v;
    });
    s.ac=ac.join('\n');s.tasks=tk.join('\n');return s;
  });
  return{stories:out,skipped};
}

function pCopy(){
  if(!S.stories.length)return`<div class="panel"><p>Add some stories first.</p><button class="btn p" data-p="write">← Write stories</button></div>`;
  const titles=S.stories.map(cardTitle).join('\n');
  return `
  <div class="panel">
    <h2>How to put this into Trello</h2>
    <ol class="how">
      <li>Open your board and click <b>+ Add a card</b> in the list you want (e.g. Product Backlog).</li>
      <li>Click <b>Copy all titles</b> below and paste into the box — each line becomes its own card.</li>
      <li>Open a card, then use that story's <b>Copy description</b> and <b>Copy checklist</b> buttons below. Paste the description into the card's description box. For the checklist, add a checklist and paste — Trello offers to add each line as an item.</li>
      <li>In Trello, add the label (Must/Should…) and put yourself or a teammate on the card.</li>
    </ol>
    <label>Sprint Review date <small>shown as the due date in each description</small></label>
    <input type="date" id="review" value="${esc(S.review)}">
    <div class="big"><button class="btn p" data-copy="${esc(titles).replace(/\n/g,'&#10;')}">Copy all titles</button></div>
    <pre>${esc(titles)}</pre>
  </div>
  ${S.stories.map((s,i)=>`<div class="panel"><h2>${esc(cardTitle(s))}</h2>
    <div class="big" style="margin:0"><button class="btn" data-cd="${i}">Copy description</button>
    <button class="btn" data-ct="${i}" ${cardTasks(s)?'':'disabled'}>Copy checklist</button></div>
    <pre>${esc(cardDesc(s))}</pre></div>`).join('')}`;
}

/* ---------- Trello API push ---------- */
const TK='sprintkit.trello';
let T=(()=>{try{return JSON.parse(localStorage.getItem(TK))||{}}catch(e){return{}}})();
let TB={boards:[],lists:[],labels:[],members:[],msg:'',busy:false};
const saveT=()=>{try{localStorage.setItem(TK,JSON.stringify(T))}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const LABEL_FOR={Must:['Must have','red'],Should:['Should have','orange'],Could:['Could have','green'],"Won't":["Won't (this time)",'black']};

async function tr(method,path,params={}){
  const url='https://api.trello.com/1'+path, auth={key:T.key,token:T.token};
  for(let a=0;a<4;a++){
    const res=method==='GET'
      ?await fetch(url+'?'+new URLSearchParams({...auth,...params}))
      :await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({...auth,...params})});
    if(res.status===429){await sleep(10500);continue}
    if(!res.ok){const t=await res.text();throw new Error(res.status===401?'Trello rejected the key/token (401). Check both are correct.':`${res.status} ${t.slice(0,140)}`)}
    return res.json();
  }
  throw new Error('Trello rate limit hit — wait a minute and try again.');
}
async function loadBoards(){
  TB.msg='Connecting…';render();
  try{TB.boards=await tr('GET','/members/me/boards',{fields:'name',filter:'open'});TB.msg=`Connected. ${TB.boards.length} boards found.`;
    if(T.boardId&&TB.boards.some(b=>b.id===T.boardId))await loadBoard(T.boardId);}
  catch(e){TB.boards=[];TB.msg='⚠ '+e.message}
  render();
}
async function loadBoard(id){
  T.boardId=id;saveT();
  TB.lists=await tr('GET',`/boards/${id}/lists`,{filter:'open'});
  TB.labels=await tr('GET',`/boards/${id}/labels`,{fields:'name,color',limit:1000});
  TB.members=await tr('GET',`/boards/${id}/members`,{fields:'fullName,username'});
  if(T.memberId===undefined||(T.memberId&&!TB.members.some(m=>m.id===T.memberId))){
    const me=await tr('GET','/members/me',{fields:'id'});
    T.memberId=TB.members.some(m=>m.id===me.id)?me.id:'';saveT()}
  if(!TB.lists.some(l=>l.id===T.listId)){T.listId=(TB.lists.find(l=>/backlog/i.test(l.name))||TB.lists[0]||{}).id;saveT()}
}
function memberIds(owner){
  const ids=[],miss=[];
  for(const n of String(owner||'').split(',').map(x=>x.trim()).filter(Boolean)){
    const q=n.toLowerCase().replace(/^@/,''),nm=m=>(m.fullName||'').toLowerCase();
    const m=TB.members.find(m=>(m.username||'').toLowerCase()===q)||TB.members.find(m=>nm(m)===q)||TB.members.find(m=>nm(m).includes(q));
    if(m){if(!ids.includes(m.id))ids.push(m.id)}else miss.push(n);
  }
  return{ids,miss};
}
async function pushAll(){
  const log=$('#log'),say=t=>{log.textContent+=t+'\n';log.scrollTop=log.scrollHeight};
  const todo=S.stories.filter(s=>!s.cardId||T.redo);
  if(!todo.length){say('Nothing to push — all stories are already on Trello.');return}
  TB.busy=true;$('#go').disabled=true;log.textContent='';
  const due=S.review?new Date(S.review+'T17:00:00').toISOString():undefined;
  try{
    for(const s of todo){
      const [lname,color]=LABEL_FOR[s.pri]||LABEL_FOR.Should;
      let lab=TB.labels.find(l=>l.name===lname);
      if(!lab&&T.makeLabels){lab=await tr('POST','/labels',{name:lname,color,idBoard:T.boardId});TB.labels.push(lab);say(`Created label “${lname}”`)}
      const p={idList:T.listId,name:cardTitle(s),desc:cardDesc(s),pos:'bottom'};
      if(due)p.due=due;if(lab)p.idLabels=lab.id;
      const {ids,miss}=memberIds(s.owner),who=ids.length?ids:(T.memberId?[T.memberId]:[]);
      if(who.length)p.idMembers=who.join(',');
      if(miss.length)say(`⚠ ${s.id}: no board member matches “${miss.join(', ')}”${ids.length?'':' — used the default person'}`);
      const card=await tr('POST','/cards',p);
      s.cardId=card.id;s.cardUrl=card.shortUrl;save();
      const items=cardTasks(s).split('\n').filter(Boolean);
      if(items.length){const cl=await tr('POST','/checklists',{idCard:card.id,name:'Checklist'});
        for(const it of items){await tr('POST',`/checklists/${cl.id}/checkItems`,{name:it});await sleep(120)}}
      say(`✓ ${s.id} ${s.title}`);await sleep(150);
    }
    say(`\nDone — ${todo.length} card(s) created.`);
  }catch(e){say('\n⚠ Stopped: '+e.message+'\nStories already created are marked; run again to continue with the rest.')}
  TB.busy=false;const keep=log.textContent;render();if($('#log'))$('#log').textContent=keep;
}
function pPush(){
  if(!S.stories.length)return`<div class="panel"><p>Add some stories first.</p><button class="btn p" data-p="write">← Write stories</button></div>`;
  const connected=TB.boards.length>0, pending=S.stories.filter(s=>!s.cardId).length;
  return `
  <div class="panel"><h2>1. Connect to Trello <small class="mute">(once)</small></h2>
    <ol class="how">
      <li>Open <a href="https://trello.com/power-ups/admin" target="_blank" rel="noopener">trello.com/power-ups/admin</a> → <b>New</b>. Any name, pick your workspace, any https link for the URL. Then open its <b>API key</b> tab, generate a key and copy it.</li>
      <li>On that page click the <b>Token</b> link, <b>Allow</b>, and copy the token.</li>
    </ol>
    <label>API key</label><input id="t-key" value="${esc(T.key||'')}" autocomplete="off">
    <label>Token <small>stays in this browser only; don't share it</small></label><input id="t-token" type="password" value="${esc(T.token||'')}" autocomplete="off">
    <div class="big"><button class="btn p" id="connect">Connect</button><button class="btn link" id="forget">Forget key &amp; token</button></div>
    <p class="mute">${esc(TB.msg)}</p></div>
  ${connected?`<div class="panel"><h2>2. Choose where the cards go</h2>
    <label>Board</label><select id="t-board"><option value="">— choose —</option>${TB.boards.map(b=>`<option value="${b.id}" ${T.boardId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>
    ${TB.lists.length?`<label>List</label><select id="t-list">${TB.lists.map(l=>`<option value="${l.id}" ${T.listId===l.id?'selected':''}>${esc(l.name)}</option>`).join('')}</select>
    <label>Default person <small>added to cards whose story has no owner (or an owner that isn't on the board)</small></label>
    <select id="t-member"><option value="">Nobody</option>${TB.members.map(m=>`<option value="${m.id}" ${T.memberId===m.id?'selected':''}>${esc(m.fullName||m.username)}</option>`).join('')}</select>
    <label style="font-weight:400"><input type="checkbox" id="t-mk" ${T.makeLabels?'checked':''} style="width:auto"> Create the Must / Should / Could labels if the board doesn't have them</label>
    <label style="font-weight:400"><input type="checkbox" id="t-redo" ${T.redo?'checked':''} style="width:auto"> Also re-create stories already pushed (makes duplicates)</label>`:''}</div>`:''}
  ${connected&&TB.lists.length?`<div class="panel"><h2>3. Push</h2>
    <p>${pending} of ${S.stories.length} stories not on Trello yet. Each becomes a card with its description, due date, priority label and checklist.</p>
    <div class="big"><button class="btn p" id="go" ${TB.busy?'disabled':''}>Create ${T.redo?S.stories.length:pending} card(s) in Trello</button></div>
    <pre id="log" style="min-height:40px"></pre>
    <div>${S.stories.filter(s=>s.cardUrl).map(s=>`<div class="mute">✓ ${esc(s.id)} — <a href="${esc(s.cardUrl)}" target="_blank" rel="noopener">open card</a></div>`).join('')}</div>
    <p class="mute">Later edits here don't update cards already in Trello; edit those in Trello.</p></div>`:''}`;
}

function pSetup(){
  const lists=['Product Backlog','Sprint Backlog','Doing (max 3)','In Review (max 4)','Testing / QA','Done · Sprint 1','Client Feedback'].join('\n');
  const labels=['Must have','Should have','Could have',"Won't (this time)",'Feature','Bug','Docs / Report','AI feature','Blocked'].join('\n');
  const dod=['Acceptance criteria shown to the PO','Code reviewed by 1 teammate','CI passes','Tests pass','Card ID in branch, commits and PR title'].join('\n');
  const blk=(t,h,x)=>`<div class="panel"><h2>${t}</h2><p class="mute" style="margin-top:0">${h}</p><div class="big" style="margin:0"><button class="btn p" data-copy="${esc(x).replace(/\n/g,'&#10;')}">Copy</button></div><pre>${esc(x)}</pre></div>`;
  return `<button class="btn link" data-p="write">← Back</button>
  <p class="sub">Do this once per project. You only need it for a brand-new board.</p>
  ${blk('1. Board lists','Make a new board, click “Add another list”, and paste. Each line becomes a list.',lists)}
  ${blk('2. Labels','Board menu → Labels → Create a label. Make one per line (name them, not just a colour).',labels)}
  ${blk('3. Definition of Done','Put this checklist on a card and make it a template to copy into every story.',dod)}`;
}

/* ---------- events ---------- */
function bind(){
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy,b));
  document.querySelectorAll('[data-cd]').forEach(b=>b.onclick=()=>copy(cardDesc(S.stories[+b.dataset.cd]),b));
  document.querySelectorAll('[data-ct]').forEach(b=>b.onclick=()=>copy(cardTasks(S.stories[+b.dataset.ct]),b));
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=+b.dataset.edit;render();scrollTo(0,0)});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Delete this story?')){S.stories.splice(+b.dataset.del,1);editing=null;save();render()}});
  if($('#connect'))$('#connect').onclick=()=>{T.key=$('#t-key').value.trim();T.token=$('#t-token').value.trim();if(!T.key||!T.token){TB.msg='Enter both the key and the token.';render();return}saveT();loadBoards()};
  if($('#forget'))$('#forget').onclick=()=>{T={};saveT();TB={boards:[],lists:[],labels:[],members:[],msg:'',busy:false};render()};
  if($('#t-board'))$('#t-board').onchange=async e=>{if(!e.target.value)return;try{await loadBoard(e.target.value)}catch(x){TB.msg='⚠ '+x.message}render()};
  if($('#t-list'))$('#t-list').onchange=e=>{T.listId=e.target.value;saveT()};
  if($('#t-member'))$('#t-member').onchange=e=>{T.memberId=e.target.value;saveT()};
  if($('#t-mk'))$('#t-mk').onchange=e=>{T.makeLabels=e.target.checked;saveT()};
  if($('#t-redo'))$('#t-redo').onchange=e=>{T.redo=e.target.checked;saveT();render()};
  if($('#go'))$('#go').onclick=pushAll;
  if($('#review'))$('#review').onchange=e=>{S.review=e.target.value;save();render()};
  if($('#bulk-go'))$('#bulk-go').onclick=()=>{
    const {stories,skipped}=parseStories($('#bulk').value);
    if(!stories.length){toast('Paste some stories first');return}
    stories.forEach(s=>S.stories.push({id:nextId(),...s}));
    save();render();
    toast(`Imported ${stories.length} stor${stories.length===1?'y':'ies'}`+(skipped?` (${skipped} line${skipped===1?'':'s'} not understood)`:''));
  };
  if($('#cancel'))$('#cancel').onclick=()=>{editing=null;render()};
  if($('#save'))$('#save').onclick=()=>{
    const v=k=>$('#f-'+k).value.trim();
    if(!v('title')){toast('Give the story a title');$('#f-title').focus();return}
    const d={title:v('title'),role:v('role'),want:v('want'),why:v('why'),ac:$('#f-ac').value,points:v('points'),pri:v('pri'),tasks:$('#f-tasks').value,owner:v('owner')};
    if(editing!==null)Object.assign(S.stories[editing],d);else S.stories.push({id:nextId(),...d});
    editing=null;save();render();toast('Saved');scrollTo(0,0);
  };
}
$('#goSetup').onclick=()=>{page='setup';render()};
$('#exp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='sprint-stories.json';a.click()};
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.stories)throw 0;S=d;save();page='write';render()}catch(x){alert('Not a valid backup file')}})};
render();
</script>
</body>
</html>
