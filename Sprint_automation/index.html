<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprint Kit for Trello</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#172b4d;--mute:#6b778c;--line:#dfe1e6;--accent:#0c66e4;--ok:#1f845a}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#1d2125;--card:#22272b;--ink:#dee4ea;--mute:#9fadbc;--line:#38414a;--accent:#579dff;--ok:#4bce97}}
:root[data-theme=dark]{--bg:#1d2125;--card:#22272b;--ink:#dee4ea;--mute:#9fadbc;--line:#38414a;--accent:#579dff;--ok:#4bce97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
@media(min-width:900px){#main.pg-write{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
@media(min-width:1100px){#main.pg-push{grid-template-columns:repeat(3,minmax(0,1fr))}}
.wrap{max-width:1680px;margin:0 auto;padding:12px 16px 0;min-height:100vh;display:flex;flex-direction:column}
#main{margin-bottom:14px}
h1{font-size:20px;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:4px}
#theme{padding:5px 11px}
.sub{color:var(--mute);margin:0 0 10px}
.steps{display:flex;gap:8px;margin-bottom:12px}
.steps button{flex:1;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer;font:inherit;font-weight:600;text-align:left}
.steps button.on{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -3px 0 var(--accent)}
.steps b{display:block;font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
#main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;align-items:start}
#main>:not(.panel):not(.stack),.wide{grid-column:1/-1}
.stack{display:grid;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0}
.panel h2{font-size:15px;margin:0 0 8px}
label{display:block;font-weight:600;margin:8px 0 2px}
label small{font-weight:400;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{resize:vertical;min-height:52px}
input:not([type=checkbox]):not([type=file]),select{height:36px}
select{padding-top:0;padding-bottom:0;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
@media(min-width:720px){.span2{grid-column:span 2}}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600}
.btn.p{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.link{border:0;background:none;color:var(--accent);padding:2px 6px}
.btn.done{background:var(--ok);border-color:var(--ok);color:#fff}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.6;cursor:default}
.btn.busy::before{content:'';display:inline-block;width:11px;height:11px;margin-right:8px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
@keyframes spin{to{transform:rotate(360deg)}}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:700}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.head>div:first-child{flex:1;min-width:260px}
.headbtn{display:flex;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:2px 0 12px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stat b{display:block;font-size:22px;line-height:1.2}
.stat span{color:var(--mute);font-size:12px}
.progress{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media(max-width:720px){.cols2{grid-template-columns:1fr}}
.banner{padding:8px 10px;border-radius:6px;margin-top:10px;font-weight:600;border:1px solid}
.banner.ok{color:var(--ok);border-color:var(--ok)}
.banner.err{color:#c9372c;border-color:#c9372c}
.item{display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.dlg{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(9,30,66,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:dlgin .12s ease-out}
.dlg-box{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:380px;box-shadow:0 16px 48px rgba(0,0,0,.35)}
.dlg-box h3{margin:0 0 6px;font-size:16px}.dlg-box p{margin:0;color:var(--mute)}
.dlg-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.btn.d{background:#c9372c;border-color:#c9372c;color:#fff}.btn.d:hover{background:#ae2e24}
@keyframes dlgin{from{opacity:0}to{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chips .btn{padding:3px 10px;border-radius:999px;font-weight:500;font-size:12px}
.pick{flex-wrap:wrap}.pick .grow{flex:1 1 170px}.pick select{width:auto;min-width:200px;max-width:100%;flex:0 1 auto;padding-right:28px;text-overflow:clip}
.mute{color:var(--mute);font-size:13px}
ol.how{margin:0 0 12px;padding-left:20px}
ol.how li{margin:4px 0}
.big{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;margin:8px 0 0;font:13px/1.5 ui-monospace,Consolas,monospace;max-height:180px;overflow:auto}
.foot{margin-top:auto;position:sticky;bottom:0;z-index:5;display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:8px 6px;background:var(--bg);border-top:1px solid var(--line)}
.foot .btn.link{padding:4px 6px}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:100;max-width:92vw;text-align:center;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#toast.on{opacity:1}
/* Lively background: soft colour glows that drift slowly behind the panels */
:root{--g1:rgba(12,102,228,.17);--g2:rgba(139,92,246,.14);--g3:rgba(31,132,90,.11)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--g1:rgba(87,157,255,.20);--g2:rgba(167,139,250,.16);--g3:rgba(75,206,151,.12)}}
:root[data-theme=dark]{--g1:rgba(87,157,255,.20);--g2:rgba(167,139,250,.16);--g3:rgba(75,206,151,.12)}
body::before{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;will-change:transform;
  background:radial-gradient(35% 40% at 15% 20%,var(--g1),transparent 70%),radial-gradient(30% 35% at 85% 15%,var(--g2),transparent 70%),radial-gradient(35% 40% at 60% 90%,var(--g3),transparent 70%);
  animation:drift 16s ease-in-out infinite alternate}
body::after{content:'';position:fixed;inset:-20%;z-index:-1;pointer-events:none;will-change:transform;
  background:radial-gradient(30% 35% at 80% 70%,var(--g4),transparent 70%),radial-gradient(28% 32% at 25% 75%,var(--g5),transparent 70%),radial-gradient(25% 30% at 50% 35%,var(--g2),transparent 70%);
  animation:drift2 21s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(-6%,-4%,0) rotate(-3deg) scale(1)}to{transform:translate3d(7%,5%,0) rotate(4deg) scale(1.18)}}
@keyframes drift2{from{transform:translate3d(6%,4%,0) rotate(3deg) scale(1.1)}to{transform:translate3d(-7%,-5%,0) rotate(-4deg) scale(.95)}}
@media (prefers-reduced-motion:reduce){body::before,body::after{animation:none}}
html.idle body::before,html.idle body::after{animation-play-state:paused}
/* Glass cards: see-through with a soft blur. Blur is costly, so it is small, and it is dropped on pages with many cards. */
.panel{background:color-mix(in srgb,var(--card) 64%,transparent);-webkit-backdrop-filter:blur(10px) saturate(140%);backdrop-filter:blur(10px) saturate(140%);
  border-color:rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.07)}
:root[data-theme=dark] .panel{border-left-color:rgba(255,255,255,.1);border-right-color:rgba(255,255,255,.1);border-bottom-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .panel{border-left-color:rgba(255,255,255,.1);border-right-color:rgba(255,255,255,.1);border-bottom-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.25)}}
#main.lite .panel{-webkit-backdrop-filter:none;backdrop-filter:none;background:color-mix(in srgb,var(--card) 90%,transparent)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.panel{background:var(--card)}}
.panel{box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05)}
h1{background:linear-gradient(90deg,var(--accent),#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.steps button{transition:border-color .15s,box-shadow .15s}
.steps button:hover{border-color:var(--accent)}
.foot{background:color-mix(in srgb,var(--bg) 80%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#bulk{font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.55}
a{color:var(--accent)}
/* Accent touches: each step has its own colour, and the panels carry the colour of the step you are on */
:root{--c1:#0c66e4;--c2:#0891b2;--c3:#7c3aed;--c4:#1f845a;--g1:rgba(12,102,228,.34);--g2:rgba(139,92,246,.30);--g3:rgba(31,132,90,.24);--g4:rgba(8,145,178,.28);--g5:rgba(244,114,182,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--c1:#579dff;--c2:#22d3ee;--c3:#a78bfa;--c4:#4bce97;--g1:rgba(87,157,255,.38);--g2:rgba(167,139,250,.32);--g3:rgba(75,206,151,.26);--g4:rgba(34,211,238,.26);--g5:rgba(244,114,182,.22)}}
:root[data-theme=dark]{--c1:#579dff;--c2:#22d3ee;--c3:#a78bfa;--c4:#4bce97;--g1:rgba(87,157,255,.38);--g2:rgba(167,139,250,.32);--g3:rgba(75,206,151,.26);--g4:rgba(34,211,238,.26);--g5:rgba(244,114,182,.22)}
.steps button:nth-child(1){--sc:var(--c1)}.steps button:nth-child(2){--sc:var(--c2)}.steps button:nth-child(3){--sc:var(--c3)}.steps button:nth-child(4){--sc:var(--c4)}
.steps b{color:var(--sc)}
.steps button:hover{border-color:var(--sc)}
.steps button.on{border-color:var(--sc);box-shadow:inset 0 -3px 0 var(--sc)}
#main{--pc:var(--c1)}#main.pg-copy{--pc:var(--c2)}#main.pg-push{--pc:var(--c3)}#main.pg-report{--pc:var(--c4)}
.panel{border-top:3px solid var(--pc)}
.cols{display:grid;grid-template-columns:repeat(var(--n,1),minmax(0,1fr));gap:10px;align-items:end}
@media(max-width:560px){.two,.three,.cols{grid-template-columns:1fr}}
.top .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#settingsBtn{padding:5px 11px}
#settingsBtn.on{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
#main.pg-settings{--pc:var(--c3)}
.tabbar{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:-4px 0 12px;overflow-x:auto}
.tabbar button{border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);font:inherit;font-weight:600;padding:8px 12px;cursor:pointer;white-space:nowrap}
.tabbar button:hover{color:var(--ink)}
.tabbar button.on{color:var(--ink);border-bottom-color:var(--pc)}
.set-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:6px;position:sticky;top:8px}
.set-nav button{display:block;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:8px;cursor:pointer;font:inherit;transition:border-color .15s,box-shadow .15s}
.set-nav button b{display:block;color:var(--ink);font-size:14px}
.set-nav button span{display:block;font-size:12px}
.set-nav button:hover{border-color:var(--pc)}
.set-nav button.on{border-color:var(--pc);box-shadow:inset 3px 0 0 var(--pc)}
.set-body{display:grid;gap:12px;max-width:880px;min-width:0}
.copy-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}
.sticky{position:sticky;top:8px}
#story-list{max-height:min(58vh,520px);overflow:auto;padding-right:4px}
#log:empty{display:none}
.tblwrap{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.tblwrap table th{position:sticky;top:0;background:var(--card);z-index:1}
td.act{white-space:nowrap;text-align:right}
td.act .btn{padding:3px 9px;font-size:12px}
tr[data-sel]{cursor:pointer}
tr[data-sel]:hover td{background:color-mix(in srgb,var(--pc) 7%,transparent)}
tr.sel td{background:color-mix(in srgb,var(--pc) 14%,transparent)}
.tblwrap td select{width:100%;min-width:170px}
@media(max-width:900px){.copy-layout{grid-template-columns:minmax(0,1fr)}.sticky{position:static}}
@media(max-width:820px){.set-layout{grid-template-columns:minmax(0,1fr)}.set-nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px}.set-nav button{width:auto;white-space:nowrap}.set-nav button span{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Sprint Kit for Trello</h1><div class="acts"><button class="btn" id="settingsBtn" title="Settings: IDs, priorities, card format, report rules and more">⚙ Settings</button><button class="btn" id="theme" title="Switch between automatic, light and dark"></button></div></div>
  <p class="sub">Write your user stories here, then copy them into Trello.</p>
  <div class="banner ok" id="upd" hidden style="margin:0 0 12px"></div>
  <div class="steps" id="steps"></div>
  <div id="main"></div>
  <div class="foot">
    <button class="btn link" id="goSetup">First time? Set up a Trello board</button>
    <button class="btn link" id="chk" hidden>Check for updates</button>
    <span class="mute" id="ver" style="align-self:center"></span>
  </div>
</div>
<div id="toast"></div>

<script>
const KEY='sprintkit.v2';
let S=load(), page='write', editing=null;

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.stories)return d}catch(e){}return{review:'',stories:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
// In-app message box (the browser's own confirm() looks out of place in the desktop app)
function ask(title,text,{ok='OK',cancel='Cancel',danger=false}={}){
  return new Promise(done=>{
    const prev=document.activeElement,o=document.createElement('div');
    o.className='dlg';o.innerHTML=`<div class="dlg-box" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t"><h3 id="dlg-t">${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}<div class="dlg-btns">${cancel?`<button class="btn" data-r="0">${esc(cancel)}</button>`:''}<button class="btn ${danger?'d':'p'}" data-r="1">${esc(ok)}</button></div></div>`;
    const finish=v=>{document.removeEventListener('keydown',key,true);o.remove();if(prev&&prev.focus)prev.focus();done(v)};
    const key=e=>{
      if(e.key==='Escape'){e.preventDefault();e.stopPropagation();finish(false)}
      else if(e.key==='Tab'){const b=[...o.querySelectorAll('button')],i=b.indexOf(document.activeElement);e.preventDefault();b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus()}};
    o.onclick=e=>{if(e.target===o)finish(false);const b=e.target.closest('[data-r]');if(b)finish(b.dataset.r==='1')};
    document.addEventListener('keydown',key,true);document.body.appendChild(o);
    (danger&&cancel?o.querySelector('[data-r="0"]'):o.querySelector('[data-r="1"]')).focus();
  });
}
let toastT;
function toast(t){const e=$('#toast');e.textContent=t;e.style.pointerEvents='';e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),2400)}
// A message with an Undo button that stays for 8 seconds.
function undoToast(msg,undo){
  const e=$('#toast'),b=document.createElement('button');
  b.className='btn link';b.textContent='Undo';b.style.cssText='margin-left:8px;color:inherit;text-decoration:underline';
  b.onclick=()=>{undo();e.classList.remove('on');e.style.pointerEvents=''};
  e.textContent=msg;e.append(b);e.style.pointerEvents='auto';e.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>{e.classList.remove('on');e.style.pointerEvents=''},8000);
}
async function copy(t,btn,msg){
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}
  toast(msg||'Copied. Now paste it in Trello');if(btn){btn.classList.add('done');btn.textContent='Copied ✓'}
}
/* Story IDs. The prefix and the number of digits are settings, so a team can use FR-03, REQ-003 and so on.
   Stories that already exist keep their IDs: the ID is in the card's title on Trello and the PR sync looks cards up by it. */
const ID_DEFAULTS={idPrefix:'US',idPad:2};
const DEFAULT_TITLE='{id} · {title} {points}';
const DEFAULT_DESC=['{#story}','**As a** {role|…}','**I want** {want|…}','**so that** {why|…}','','{/story}','{#criteria}','**Acceptance criteria**','{criteria}','','{/criteria}','**Priority:** {priority}','**Owner:** {owner}','**Due:** {due}'].join('\n');
const CARD_DEFAULTS={cardTitle:DEFAULT_TITLE,cardDesc:DEFAULT_DESC,checklistName:'Checklist'};
const REPORT_DEFAULTS={doneWords:'done',skipWords:'product backlog, feedback',feedbackWords:'feedback',testWords:'testing, test, qa',wipWord:'max',staleDays:7,
  checks:{owner:true,checklist:true,testing:true,done:true,stale:true}};
const reportCfg=()=>{const r=(S.settings&&S.settings.report)||{};return{...REPORT_DEFAULTS,...r,checks:{...REPORT_DEFAULTS.checks,...(r.checks||{})}}};
// "done, finished" becomes a test for a list name that contains one of the words as a whole word. No words: nothing matches.
const wordsRe=csv=>{const w=String(csv||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));return w.length?new RegExp('(?<![A-Za-z0-9])(?:'+w.join('|')+')(?![A-Za-z0-9])','i'):/$^/};
/* Dates and times: language, how a date is written, 12 or 24 hour clock, and the time a card is due. The defaults are what the app always did. */
const DATES_DEFAULTS={locale:'en-GB',dateStyle:'short',hour12:'',dueTime:'17:00'};
const LOCALES=[['en-GB','English (UK)'],['en-US','English (US)'],['en-AU','English (Australia)'],['en-SG','English (Singapore)'],['ms-MY','Bahasa Malaysia'],['id-ID','Bahasa Indonesia'],['zh-CN','中文 (简体)'],['de-DE','Deutsch'],['fr-FR','Français'],['es-ES','Español'],['ja-JP','日本語'],['','Same as my computer']];
const DATE_STYLES=[['short','17 Oct'],['medium','17 Oct 2026'],['long','17 October 2026'],['numeric','17/10/2026 (as your language writes it)'],['iso','2026-10-17']];
const datesCfg=()=>({...DATES_DEFAULTS,...((S.settings&&S.settings.dates)||{})});
const loc=()=>datesCfg().locale||undefined;
const hourOpt=()=>{const h=datesCfg().hour12;return h==='12'?{hour12:true}:h==='24'?{hour12:false}:{}};
function fmtDate(d){
  if(!d||!/^\d{4}-\d{2}-\d{2}$/.test(d))return'';
  const c=datesCfg();if(c.dateStyle==='iso')return d;
  const o={short:{day:'numeric',month:'short'},medium:{day:'numeric',month:'short',year:'numeric'},long:{day:'numeric',month:'long',year:'numeric'},numeric:{day:'2-digit',month:'2-digit',year:'numeric'}}[c.dateStyle]||{day:'numeric',month:'short'};
  try{return new Date(d+'T12:00:00').toLocaleDateString(loc(),o)}catch(e){return d}
}
const stampLong=d=>{try{return d.toLocaleString(loc(),hourOpt())}catch(e){return d.toLocaleString()}};

function cleanSettings(st){

  const out=[],stack=[];

    const t=raw.trim(),open=t.match(/^\{#(\w+)\}$/),close=t.match(/^\{\/(\w+)\}$/);
    if(open){stack.push(!!vals[open[1]]);continue}
    if(close){stack.pop();continue}

function parseStories(text){
  let skipped=0;
  const out=text.split(/\n\s*\n/).map(b=>b.split('\n').map(x=>x.trim()).filter(Boolean)).filter(b=>b.length).map(b=>{
    const s={title:b[0].replace(/^title\s*:\s*/i,'').replace(/^(?:[-*•]|\d+[.)])\s+/,''),role:'',want:'',why:'',ac:'',points:'',pri:defPri('bulk'),tasks:'',owner:'',list:'',due:''};
    const ac=[],tk=[];
    b.slice(1).forEach(l=>{
      const sent=l.match(/^as an?\s+(.+?),?\s+i want\s+(.+?),?\s+so that\s+(.+)$/i);
      if(sent){s.role=sent[1];s.want=sent[2];s.why=sent[3];return}
      const cm=l.match(/^([^:]{1,40}?)\s*:\s*(.*)$/),cf=cm&&customByName(cm[1]);
      if(cf){const val=cleanExtra(cf,cm[2]);if(val===null)skipped++;else if(val)(s.extra=s.extra||{})[cf.key]=val;return}
      const m=l.match(/^(id|role|want|why|benefit|points|pts|pri|priority|owner|list|due|ac|done|tasks?|check)\s*:\s*(.*)$/i);
      if(!m){skipped++;return}
      const k=m[1].toLowerCase(),v=m[2].trim();
      if(k==='id'){const t=v.split(/\s/)[0];if(ID_OK.test(t))s.id=t.toUpperCase();else skipped++}
      else if(k==='ac'||k==='done')ac.push(v);
      else if(k==='task'||k==='tasks'||k==='check')tk.push(v);
      else if(k==='pri'||k==='priority'){const k2=matchPri(v);if(k2)s.pri=k2;else skipped++}
      else if(k==='points'||k==='pts')s.points=v.replace(/\D/g,'');
      else if(k==='benefit')s.why=v;
      else if(k==='due'){if(/^\d{4}-\d{2}-\d{2}$/.test(v))s.due=v;else if(v)skipped++}
      else s[k]=v;
    });
    s.ac=ac.join('\n');s.tasks=tk.join('\n');return s;
  });
  return{stories:out,skipped};
}

// Export, so the stories can go into any other tool (most tools can import a CSV file)
// A cell starting with = + - or @ is run as a formula by Excel and Sheets, so it gets a leading quote.
const csvCell=v=>{const x=String(v??'');return '"'+(/^[=+\-@\t\r]/.test(x)?"'"+x:x).replace(/"/g,'""')+'"'};
const plainOwner=o=>String(o||'').split(',').map(n=>n.trim().replace(/^@/,'')).filter(Boolean).join(', ');
// Column names the Jira, Linear and Notion importers expect. Description holds the story, criteria and tasks.
const CSV_FORMATS={
  generic:{head:['ID','Title','Summary','Description','Priority','Points','Owner','Acceptance criteria','Tasks'],
    row:s=>[s.id,s.title,cardTitle(s),cardDesc(s),priName(s.pri),s.points,plainOwner(s.owner),lines(s.ac).join('\n'),lines(s.tasks).join('\n')]},
  jira:{head:['Summary','Issue Type','Priority','Story point estimate','Assignee','Description'],
    row:s=>[cardTitle(s),'Story',scaleFor(s.pri,JIRA_SCALE),s.points,plainOwner(s.owner),cardDesc(s)+(lines(s.tasks).length?'\n\nTasks:\n'+lines(s.tasks).map(x=>'* '+x).join('\n'):'')]},
  linear:{head:['Title','Description','Priority','Estimate','Assignee'],
    row:s=>[cardTitle(s),cardDesc(s)+(lines(s.tasks).length?'\n\n'+lines(s.tasks).map(x=>'- [ ] '+x).join('\n'):''),scaleFor(s.pri,LINEAR_SCALE),s.points,plainOwner(s.owner)]},
  notion:{head:['Name','Priority','Points','Owner','Description'],
    row:s=>[cardTitle(s),priName(s.pri),s.points,plainOwner(s.owner),cardDesc(s)+(lines(s.tasks).length?'\n\nTasks:\n'+lines(s.tasks).map(x=>'- '+x).join('\n'):'')]}
};
function storiesCSV(fmt='generic'){
  const f=CSV_FORMATS[fmt]||CSV_FORMATS.generic;let head=f.head,rows=S.stories.map(f.row);
  const cf=customFields();
  if(f===CSV_FORMATS.generic&&cf.length){head=[...head,...cf.map(c=>c.label)];rows=rows.map((r,i)=>[...r,...cf.map(c=>extraShown(c,(S.stories[i].extra||{})[c.key]))])}
  return String.fromCharCode(0xFEFF)+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');
}
function storiesMarkdown(){
  return '# Sprint stories\n\n'+S.stories.map(s=>{
    const t=lines(s.tasks);
    return `## ${cardTitle(s)}\n\n${cardDesc(s)}`+(t.length?'\n\n**Tasks**\n'+t.map(x=>'- '+x).join('\n'):'');
  }).join('\n\n');
}
// The desktop app has no browser-style downloads, so there it opens a Save As window and writes the file itself.
async function saveFile(name,text,type,okMsg){
  const T=window.__TAURI__;
  if(T&&T.dialog&&T.fs){
    try{
      const ext=name.split('.').pop();
      const path=await T.dialog.save({defaultPath:name,filters:[{name:ext.toUpperCase()+' file',extensions:[ext]}]});
      if(!path)return;
      await T.fs.writeTextFile(path,text);
      toast(okMsg);
    }catch(x){toast('Could not save the file: '+(x&&x.message||x))}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast(okMsg);
}
const EXP_FORMATS=[['csv','Generic CSV'],['jira','Jira CSV'],['linear','Linear CSV'],['notion','Notion CSV'],['md','Markdown']];
let expFmt='csv';
function exportStories(kind,copyIt){
  const day=new Date().toISOString().slice(0,10),label=(EXP_FORMATS.find(f=>f[0]===kind)||[])[1]||'Export';
  if(kind==='md'){
    if(copyIt)copy(storiesMarkdown(),null,'Markdown copied.');
    else saveFile(`stories-${day}.md`,storiesMarkdown(),'text/markdown;charset=utf-8','Markdown file saved.');
  }else if(copyIt)copy(storiesCSV(kind).slice(1),null,`${label} copied. Paste it into a spreadsheet or an import box.`);
  else saveFile(`stories-${kind==='csv'?'':kind+'-'}${day}.csv`,storiesCSV(kind),'text/csv;charset=utf-8',`${label} saved.`+(kind==='csv'?' Most tools can import it.':" Use that tool's CSV import and match the columns."));
}

const SECURE=!!(window.__TAURI__&&window.__TAURI__.core);
let secureOK=false;

async function persistSecrets(){
  if(!secureOK)return;
  try{for(const n of['key','token'])T[n]?await inv('secret_set',{name:n,value:T[n]}):await inv('secret_delete',{name:n})}
  catch(e){secureOK=false;TB.msg='⚠ Could not use Windows Credential Manager ('+e+'); the key stays in app storage.'}
}
async function initSecure(){
  if(!SECURE)return;
  try{
    const stored={key:await inv('secret_get',{name:'key'}),token:await inv('secret_get',{name:'token'})};
    const legacy=T.key||T.token;           // plaintext saved by an earlier version: move it
    secureOK=true;
    if(!legacy){T.key=stored.key||'';T.token=stored.token||''}
    await persistSecrets();
    saveT();render();
  }catch(e){secureOK=false;TB.msg='⚠ Could not use Windows Credential Manager ('+e+'); the key stays in app storage.';render()}
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function tr(method,path,params={}){
  const url='https://api.trello.com/1'+path, auth={key:T.key,token:T.token};
  for(let a=0;a<4;a++){
    const res=method==='GET'
      ?await fetch(url+'?'+new URLSearchParams({...auth,...params}))
      :await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify({...auth,...params})});
    if(res.status===429){await sleep(10500);continue}
    if(!res.ok){const t=await res.text();throw new Error(res.status===401?'Trello rejected the key/token (401). Check both are correct.':`${res.status} ${t.slice(0,140)}`)}
    return res.json();
  }
  throw new Error('Trello is limiting requests. Wait a minute and try again.');
}

async function loadBoard(id){
  T.boardId=id;saveT();
  TB.lists=await tr('GET',`/boards/${id}/lists`,{filter:'open'});
  TB.labels=await tr('GET',`/boards/${id}/labels`,{fields:'name,color',limit:1000});
  TB.members=await tr('GET',`/boards/${id}/members`,{fields:'fullName,username'});
  if(T.memberId===undefined||(T.memberId&&!TB.members.some(m=>m.id===T.memberId))){
    const me=await tr('GET','/members/me',{fields:'id'});
    T.memberId=TB.members.some(m=>m.id===me.id)?me.id:'';saveT()}
  if(!TB.lists.some(l=>l.id===T.listId)){T.listId=(TB.lists.find(l=>/backlog/i.test(l.name))||TB.lists[0]||{}).id;saveT()}
}
function memberIds(owner){
  const ids=[],miss=[];
  for(const n of String(owner||'').split(',').map(x=>x.trim()).filter(Boolean)){
    const q=n.toLowerCase().replace(/^@/,''),nm=m=>(m.fullName||'').toLowerCase();
    const m=TB.members.find(m=>(m.username||'').toLowerCase()===q)||TB.members.find(m=>nm(m)===q)||TB.members.find(m=>nm(m).includes(q));
    if(m){if(!ids.includes(m.id))ids.push(m.id)}else miss.push(n);
  }
  return{ids,miss};
}
// Which Trello list a story goes to: its own "list" (matched by name) or the default list from Step 2b.
// What happens to a named list the board lacks is set in Card options: skip the story (default, so one set of stories can be bound to several boards), create the list, or use the default list.
// The list a story asked for on this board: a choice made in the Push step (kept per board) wins over the story's own list.
const wanted=s=>{const o=s.listBy&&s.listBy[T.boardId];return o!==undefined?o:s.list};
function listFor(s){
  if(s.skip||(s.listBy&&s.listBy[T.boardId]==='__skip__'))return{skip:true,chosen:true};
  const def=TB.lists.find(l=>l.id===T.listId)||TB.lists[0],want=String(wanted(s)||'').trim().toLowerCase();
  if(!want)return{id:def.id,name:def.name};
  const l=TB.lists.find(l=>l.name.toLowerCase()===want)||TB.lists.find(l=>l.name.toLowerCase().includes(want));
  if(l)return{id:l.id,name:l.name};
  const mode=T.missing||(T.makeLists?'create':'skip');   // makeLists is the older checkbox
  if(mode==='create')return{make:true,name:String(wanted(s)).trim()};
  if(mode==='default')return{id:def.id,name:def.name,miss:wanted(s)};
  return{skip:true,miss:wanted(s)};
}
// A story is "pushed" only while its card still exists. If the card was archived or deleted in Trello,
// forget the link so the story can be pushed again.
// A story's card link belongs to one board. On another board the story counts as not pushed yet (an existing card
// with the same title there is reused, so going back and forth does not duplicate).
const isPushed=s=>!!s.cardId&&(!s.cardBoard||s.cardBoard===T.boardId);
async function reconcilePushed(say=()=>{}){
  const mine=S.stories.filter(s=>isPushed(s)&&!s.done);
  if(!mine.length||!T.boardId)return 0;
  // One request for the whole board instead of one per card. A card missing from it was deleted or moved away.
  const have=new Map((await tr('GET',`/boards/${T.boardId}/cards`,{filter:'all',fields:'closed,idList'})).map(c=>[c.id,c]));
  let cleared=0;
  for(const s of mine){
    if(!s.cardBoard)s.cardBoard=T.boardId;
    const c=have.get(s.cardId);
    if(!c||c.closed!==false){
      delete s.cardId;delete s.cardUrl;delete s.cardBoard;delete s.clId;delete s.checkDone;cleared++;
      say(`↺ ${s.id}: its card was archived or deleted in Trello, so it will be created again`);
    }else{const l=TB.lists.find(x=>x.id===c.idList);if(l)s.cardList=l.name}   // moved in Trello itself
  }
  save();
  return cleared;
}
// Moves the cards of the given stories to another list on the board.
async function moveCards(stories,listId){
  const l=TB.lists.find(x=>x.id===listId);
  if(!l||TB.busy)return;
  TB.busy=true;TB.result=null;render();
  let moved=0,failed=0,last='';
  for(const s of stories){
    if(s.cardList===l.name)continue;
    try{await tr('PUT',`/cards/${s.cardId}`,{idList:l.id,pos:'bottom'});s.cardList=l.name;moved++;save();await sleep(120)}
    catch(e){failed++;last=e.message}
  }
  TB.busy=false;
  TB.result=failed?{ok:false,text:`Moved ${moved}, ${failed} failed: ${last}`}:{ok:true,text:moved?`Moved ${moved} card(s) to “${l.name}”.`:`Those cards are already in “${l.name}”.`};
  render();
}
// Adds the checklist for a card. After an interrupted push it reuses what is already there, so nothing is duplicated.
async function finishChecklist(s,items,fresh){
  let id=s.clId;
  if(!id){
    const have=fresh?[]:await tr('GET',`/cards/${s.cardId}/checklists`,{fields:'name'});
    const cl=cfg().checklistName;
    id=(have.find(c=>c.name===cl)||await tr('POST','/checklists',{idCard:s.cardId,name:cl})).id;
    s.clId=id;save();
  }
  const names=fresh?[]:(await tr('GET',`/checklists/${id}/checkItems`,{fields:'name'})).map(i=>i.name);
  for(const it of items){
    const k=names.indexOf(it);
    if(k>=0){names.splice(k,1);continue}
    await tr('POST',`/checklists/${id}/checkItems`,{name:it});await sleep(120);
  }
}
async function pushAll(){
  const log=$('#log'),say=t=>{log.textContent+=t+'\n';log.scrollTop=log.scrollHeight};
  const go=$('#go');go.disabled=true;go.classList.add('busy');go.textContent='Checking Trello…';log.textContent='';
  try{await reconcilePushed(say)}
  catch(e){TB.result={ok:false,text:'Could not check Trello: '+e.message};const k=log.textContent;render();if($('#log'))$('#log').textContent=k;return}
  const todo=S.stories.filter(s=>!isPushed(s)||s.checkDone===false||T.redo);
  if(!todo.length){TB.result={ok:true,text:'Nothing to push: every story already has a card in Trello.'};const k=log.textContent;render();if($('#log'))$('#log').textContent=k;return}
  TB.busy=true;TB.result=null;go.textContent='Starting…';
  const dueOf=s=>{const d=s.due||S.review;return d?new Date(d+'T'+datesCfg().dueTime+':00').toISOString():undefined};
  let created=0,finished=0,skipped=0,failed=null;
  try{
    // If an earlier push died after Trello made a card but before we heard back, reuse it instead of duplicating it.
    const onList=new Map();
    // Looks at the whole board (not just the target list), so a card that has since moved is still recognised.
    if(!T.redo&&todo.some(s=>!isPushed(s)))
      (await tr('GET',`/boards/${T.boardId}/cards`,{filter:'open',fields:'name,shortUrl'})).forEach(c=>onList.set(c.name,c));
    for(const [i,s] of todo.entries()){
      go.textContent=`Pushing ${i+1} of ${todo.length}…`;
      const items=cardTasks(s).split('\n').filter(Boolean);
      const resume=isPushed(s)&&s.checkDone===false&&!T.redo;
      let fresh=false;
      if(resume){say(`↺ ${s.id}: finishing its checklist`);finished++}
      else{
        let card=T.redo?null:onList.get(cardTitle(s)),dest=null;
        if(card)say(`↺ ${s.id}: already on Trello, reusing that card`);
        else{
          const pl=priOf(s.pri),lname=pl&&pl.color?pl.name:'',color=pl&&pl.color;   // no colour means: add no label
          const same=n=>String(n||'').trim().toLowerCase()===lname.toLowerCase();
          let lab=lname?TB.labels.find(l=>same(l.name)):null;
          if(lname&&!lab&&T.makeLabels){lab=await tr('POST','/labels',{name:lname,color,idBoard:T.boardId});TB.labels.push(lab);say(`Created label “${lname}”`)}
          dest=listFor(s);
          if(dest.skip){say(dest.chosen?`⏭ ${s.id}: skipped, as you chose`:`⏭ ${s.id}: no list called “${dest.miss}” on this board, so it was not pushed`);skipped++;continue}
          if(dest.make){const nl=await tr('POST','/lists',{name:dest.name,idBoard:T.boardId,pos:'bottom'});TB.lists.push(nl);say(`Created list “${nl.name}”`);dest={id:nl.id,name:nl.name}}
          if(dest.miss)say(`⚠ ${s.id}: no list called “${dest.miss}”, so it goes to ${dest.name}`);
          const p={idList:dest.id,name:cardTitle(s),desc:cardDesc(s),pos:'bottom'};
          const due=dueOf(s);if(due)p.due=due;if(lab)p.idLabels=lab.id;
          const {ids,miss}=memberIds(s.owner),who=ids.length?ids:(T.memberId?[T.memberId]:[]);
          if(who.length)p.idMembers=who.join(',');
          if(miss.length)say(`⚠ ${s.id}: no board member matches “${miss.join(', ')}”${ids.length?'':', so the default person was used'}`);
          card=await tr('POST','/cards',p);fresh=true;
        }
        delete s.done;s.cardId=card.id;s.cardUrl=card.shortUrl;s.cardBoard=T.boardId;if(dest)s.cardList=dest.name;s.clId=undefined;s.checkDone=false;save();created++;
      }
      if(items.length)await finishChecklist(s,items,fresh);
      s.checkDone=true;save();
      say(`✓ ${s.id} ${s.title}`+(s.cardList?` → ${s.cardList}`:''));await sleep(150);
    }
    say(`\nDone: ${created} card(s) created`+(finished?`, ${finished} checklist(s) finished`:'')+(skipped?`, ${skipped} skipped`:'')+'.');
  }catch(e){failed=e.message;say('\n⚠ Stopped: '+e.message+'\nProgress is saved. Click the button again to carry on where it stopped. Nothing will be duplicated.')}
  TB.busy=false;
  TB.result=failed?{ok:false,text:'Stopped: '+failed+' Progress is saved; click the button again to carry on.'}
    :{ok:!(skipped&&!created),text:`Done: ${created} card(s) created`+(finished?`, ${finished} checklist(s) finished`:'')+(skipped?`, ${skipped} skipped`:'')+'.'};
  const keep=log.textContent;render();if($('#log'))$('#log').textContent=keep;
}

  const connected=TB.boards.length>0, pending=S.stories.filter(s=>!isPushed(s)).length, unfinished=S.stories.filter(s=>isPushed(s)&&s.checkDone===false).length;
  const boardName=(TB.boards.find(b=>b.id===T.boardId)||{}).name||'',toMake=T.boardId&&TB.lists.length?S.stories.filter(s=>T.redo||!isPushed(s)):[];
  const byList=new Map();toMake.forEach(s=>{const d=listFor(s),k=d.make?d.name+' (new)':d.name;if(!d.skip)byList.set(k,(byList.get(k)||0)+1)});
  const skipN=toMake.filter(s=>listFor(s).skip).length,ready=Math.max(0,pending-(T.redo?0:skipN));

        <div><label>If a story names a list the board doesn't have</label>

    </details>`:''}
  </div>
  ${connected&&TB.lists.length?`<div class="panel wide"><h2>Push</h2>
    <p style="margin-top:0">${pending} of ${S.stories.length} stories not on this board yet. Each becomes a card with its description, due date, priority label and checklist.${skipN?` <b>${skipN} will be skipped (no list on this board, or you chose to skip).</b>`:''}${unfinished?` <b>${unfinished} card(s) from an interrupted push are missing checklist items; pushing again will finish them.</b>`:''}</p>

    <div class="tblwrap"><table><tr><th>Story</th><th>Status</th><th>List</th></tr>${rows}</table></div>

/* ---------- Review report (reads the live Trello board) ---------- */
let R={cards:null,board:'',msg:'',at:null};
async function loadReport(){
  if(!T.key||!T.token||!T.boardId){R.msg='Connect and choose a board in Step 2b first.';render();return}
  R.msg='Loading from Trello…';R.busy=true;render();
  try{
    await loadBoard(T.boardId);
    R.board=(await tr('GET',`/boards/${T.boardId}`,{fields:'name'})).name;
    R.cards=await tr('GET',`/boards/${T.boardId}/cards`,{filter:'open',fields:'name,idList,idMembers,due,shortUrl,dateLastActivity',checklists:'all'});
    R.at=new Date();R.msg='';
  }catch(e){R.msg='⚠ '+e.message}
  R.busy=false;
  render();
}
function analyse(){
  const who=Object.fromEntries(TB.members.map(m=>[m.id,m.fullName||m.username]));
  const ln=Object.fromEntries(TB.lists.map(l=>[l.id,l.name]));
  const idx=Object.fromEntries(TB.lists.map((l,i)=>[l.id,i]));
  const rc=reportCfg(),{doneRe,skipRe,fbRe,testRe,wipRe}=reportMatchers();
  const defScope=TB.lists.filter(l=>!skipRe.test(l.name)&&!fbRe.test(l.name)).map(l=>l.id);   // client feedback lists are never part of the sprint by default
  // The lists that count as this sprint are remembered per board. The older single setting (T.rl) is used only for ids that exist
  // on this board, and an empty result falls back to the default so the report is never silently blank.
  const saved=((T.rlBy&&T.rlBy[T.boardId])||T.rl||[]).filter(id=>ln[id]);
  const scope=saved.length?saved:defScope;
  const now=Date.now();
  const all=R.cards.map(c=>{
    const items=(c.checklists||[]).flatMap(k=>k.checkItems);
    const pm=c.name.match(/\[(\d+)\]\s*$/);
    return{...c,list:ln[c.idList]||'?',code:(c.name.match(/^[A-Za-z][A-Za-z0-9]*(?:-[A-Za-z][A-Za-z0-9]*)*-\d+/)||[c.name.slice(0,24)])[0],
      pts:pm?+pm[1]:0,done:doneRe.test(ln[c.idList]||''),owners:c.idMembers.map(id=>who[id]||'?'),
      ci:{done:items.filter(i=>i.state==='complete').length,total:items.length},
      stale:Math.floor((now-new Date(c.dateLastActivity))/864e5)};
  });
  const cards=all.filter(c=>scope.includes(c.idList)).sort((a,b)=>idx[a.idList]-idx[b.idList]);
  const doneC=cards.filter(c=>c.done),open=cards.filter(c=>!c.done);
  const sum=a=>a.reduce((t,c)=>t+c.pts,0);
  const byList=TB.lists.filter(l=>scope.includes(l.id)).map(l=>{const cs=cards.filter(c=>c.idList===l.id);return{name:l.name,n:cs.length,pts:sum(cs),max:wipRe?(l.name.match(wipRe)||[])[1]:undefined}});
  const owners={};
  cards.forEach(c=>(c.owners.length?c.owners:['Unassigned']).forEach(o=>{const r=owners[o]||(owners[o]={n:0,dn:0,p:0,dp:0});r.n++;r.p+=c.pts;if(c.done){r.dn++;r.dp+=c.pts}}));
  const flags=[];
  byList.forEach(l=>{if(l.max&&l.n>+l.max)flags.push(`${l.name}: ${l.n} cards, over the limit of ${l.max}`)});
  open.forEach(c=>{
    if(rc.checks.owner&&!c.owners.length)flags.push(`${c.code} has no owner`);
    if(rc.checks.testing&&testRe.test(c.list)&&c.ci.total&&c.ci.done<c.ci.total)flags.push(`${c.code} is in ${c.list} but its checklist is ${c.ci.done}/${c.ci.total}`);
    if(rc.checks.checklist&&!c.ci.total)flags.push(`${c.code} has no checklist`);
    if(rc.checks.stale&&c.stale>rc.staleDays)flags.push(`${c.code} untouched for ${c.stale} days`);
  });
  if(rc.checks.done)doneC.forEach(c=>{if(c.ci.total&&c.ci.done<c.ci.total)flags.push(`${c.code} is in Done but its checklist is ${c.ci.done}/${c.ci.total}`)});
  const dl=TB.lists.find(l=>doneRe.test(l.name)),n=dl&&(dl.name.match(/\d+/)||[])[0];
  return{n,scope,cards,doneC,open,tp:sum(cards),dp:sum(doneC),byList,owners,flags,feedback:all.filter(c=>fbRe.test(c.list))};
}
const cardLine=c=>`${c.name}${c.owners.length?' ('+c.owners.join(', ')+')':''}`;
function mdReport(a){
  const pct=a.tp?Math.round(a.dp/a.tp*100):0;
  const L=[`## Sprint ${a.n||''} review: ${R.board}`.replace('  ',' '),`Generated ${stampLong(R.at)}`,'',
   `**Result:** ${a.dp} of ${a.tp} points done (${pct}%) · ${a.doneC.length} of ${a.cards.length} cards in Done`,'',
   '### By list','| List | Cards | Points |','|---|---|---|',...a.byList.map(l=>`| ${l.name} | ${l.n} | ${l.pts} |`),'',
   '### By owner','| Owner | Cards done / total | Points done / total |','|---|---|---|',...Object.entries(a.owners).map(([o,r])=>`| ${o} | ${r.dn} / ${r.n} | ${r.dp} / ${r.p} |`),'',
   `### Completed (${a.doneC.length})`,...(a.doneC.map(c=>`- ${cardLine(c)}`)),...(a.doneC.length?[]:['- none']),'',
   `### Not completed, to carry over (${a.open.length})`,...(a.open.map(c=>`- ${cardLine(c)}, in ${c.list}${c.ci.total?`, checklist ${c.ci.done}/${c.ci.total}`:''}`)),...(a.open.length?[]:['- none']),''];
  if(a.feedback.length)L.push(`### Client feedback (${a.feedback.length})`,...a.feedback.map(c=>`- ${c.name}`),'');
  if(a.flags.length)L.push('### Needs attention',...a.flags.map(f=>`- ${f}`),'');
  return L.join('\n');
}
// Archives the cards in Done and, if a list is chosen, moves the unfinished ones there. Archived cards can be restored in Trello.
async function closeSprint(){
  const a=analyse(),l=TB.lists.find(x=>x.id===$('#sc-list').value),parts=[];
  if(a.doneC.length)parts.push(`archive ${a.doneC.length} card(s) in Done`);
  if(l&&a.open.length)parts.push(`move ${a.open.length} unfinished card(s) to “${l.name}”`);
  if(!parts.length){toast('Nothing to do');return}
  if(!await ask('Close the sprint?','This will '+parts.join(' and ')+'. Archived cards can be restored from the archive in Trello.',{ok:'Close the sprint',danger:true}))return;
  R.busy=true;R.msg='Closing the sprint…';render();
  let arch=0,moved=0,failed=0;
  for(const c of a.doneC){
    try{await tr('PUT',`/cards/${c.id}`,{closed:true});arch++;const s=S.stories.find(x=>x.cardId===c.id);if(s)s.done=true;await sleep(120)}catch(e){failed++}
  }
  if(l)for(const c of a.open){
    try{await tr('PUT',`/cards/${c.id}`,{idList:l.id,pos:'bottom'});moved++;const s=S.stories.find(x=>x.cardId===c.id);if(s)s.cardList=l.name;await sleep(120)}catch(e){failed++}
  }
  save();R.busy=false;
  await loadReport();
  R.msg=`Closed: ${arch} archived, ${moved} moved`+(failed?`, ${failed} failed`:'')+'.';
  render();
}

// What the Review report makes of each list name, so a team can see before they build the board.
function listReadout(text){
  const m=reportMatchers(),names=lines(text);
  const rows=names.map(n=>{
    const t=[];
    if(m.doneRe.test(n))t.push('Done');
    if(m.fbRe.test(n))t.push('client feedback');
    else if(m.skipRe.test(n))t.push('not part of the sprint');
    if(m.testRe.test(n))t.push('testing');
    const w=m.wipRe&&n.match(m.wipRe);if(w)t.push('limit '+w[1]);
    return t.length?`<li><b>${esc(n)}</b>: ${t.join(', ')}</li>`:'';
  }).filter(Boolean).join('');
  const warn=names.length&&!names.some(n=>m.doneRe.test(n))?`<p class="banner err" style="margin:8px 0 0">No list matches the Done words (${esc(reportCfg().doneWords||'none set')}), so the report would count nothing as done. Change the list or the Done words in the report rules.</p>`:'';
  return(rows?`<p class="mute" style="margin:8px 0 0">How the Review report reads these lists:</p><ul class="mute" style="margin:4px 0 0;padding-left:20px">${rows}</ul>`:'')+warn;
}

  };
  if($('#exp')){$('#exp').onclick=()=>saveFile('sprint-stories.json',JSON.stringify(S,null,2),'application/json','Stories saved.');$('#imp').onchange=importStories}
  if($('#exp-fmt')){$('#exp-fmt').onchange=e=>{expFmt=e.target.value};$('#exp-dl').onclick=()=>exportStories(expFmt,false);$('#exp-copy').onclick=()=>exportStories(expFmt,true)}
  if($('#set-prefix')){
    const apply=()=>{
      const p=cleanPrefix($('#set-prefix').value)||ID_DEFAULTS.idPrefix;
      S.settings={...(S.settings||{}),idPrefix:p,idPad:+$('#set-pad').value};save();keepForm(render);
    };
    $('#set-prefix').onchange=apply;$('#set-pad').onchange=apply;
  }
  if($('#pri-add')){
    const edit=fn=>{S.settings={...(S.settings||{}),priorities:pris().map(p=>({...p}))};fn(S.settings);save();keepForm(render)};
    document.querySelectorAll('[data-pname]').forEach(el=>el.onchange=()=>{
      const i=+el.dataset.pname,v=el.value.trim(),old=pris()[i].name;
      if(!v||pris().some((p,j)=>j!==i&&p.name.toLowerCase()===v.toLowerCase())){toast(v?`“${v}” is already a priority`:'A priority needs a name');el.value=old;return}
      edit(st=>{st.priorities[i].name=v});
    });
    document.querySelectorAll('[data-pcolor]').forEach(el=>el.onchange=()=>edit(st=>{st.priorities[+el.dataset.pcolor].color=el.value}));
    document.querySelectorAll('[data-pup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pup;edit(st=>{[st.priorities[i-1],st.priorities[i]]=[st.priorities[i],st.priorities[i-1]]})});
    document.querySelectorAll('[data-pdown]').forEach(b=>b.onclick=()=>{const i=+b.dataset.pdown;edit(st=>{[st.priorities[i+1],st.priorities[i]]=[st.priorities[i],st.priorities[i+1]]})});
    $('#pri-add').onclick=()=>edit(st=>{
      let n='New priority',k=2;while(st.priorities.some(p=>p.name.toLowerCase()===n.toLowerCase()||p.key.toLowerCase()===n.toLowerCase()))n='New priority '+k++;
      st.priorities.push({key:n,name:n,color:'blue'});
    });
    document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.pdel,p=pris()[i],used=S.stories.filter(x=>x.pri===p.key);
      const rest=pris().filter((_,j)=>j!==i),fallback=(rest.find(r=>r.key===(S.settings&&S.settings.priDefault))||rest[Math.min(i,rest.length-1)]);
      if(used.length&&!await ask(`Delete “${p.name}”?`,`${used.length} stor${used.length===1?'y uses':'ies use'} it. ${used.length===1?'It':'They'} will change to “${fallback.name}”. Cards already on Trello are not touched.`,{ok:'Delete',danger:true}))return;
      edit(st=>{used.forEach(x=>{x.pri=fallback.key});st.priorities.splice(i,1);if(st.priDefault===p.key)delete st.priDefault});
    });
    $('#pri-reset').onclick=async()=>{
      const lost=S.stories.filter(x=>!DEFAULT_PRIS.some(p=>p.key===x.pri));
      if(!await ask('Reset the priorities?',lost.length?`${lost.length} stor${lost.length===1?'y uses':'ies use'} a priority that is not in the default four. ${lost.length===1?'It':'They'} will change to “${DEFAULT_PRIS[1].name}”.`:"The list goes back to Must have, Should have, Could have and Won't.",{ok:'Reset',danger:true}))return;
      edit(st=>{lost.forEach(x=>{x.pri=DEFAULT_PRIS[1].key});st.priorities=DEFAULT_PRIS.map(p=>({...p}));delete st.priDefault});
    };
    $('#pri-def').onchange=e=>edit(st=>{if(e.target.value)st.priDefault=e.target.value;else delete st.priDefault});
  }
  if($('#cf-add')){
    // Saves a change to the fields. Only what differs from the default is stored.
    const edit=fn=>{
      const st={...(S.settings||{})};st.customFields=customFields().map(c=>({...c,...(c.options?{options:[...c.options]}:{})}));st.fields={...(st.fields||{})};
      fn(st);
      for(const k of Object.keys(st.fields))if(!Object.keys(st.fields[k]).length)delete st.fields[k];
      if(!Object.keys(st.fields).length)delete st.fields;
      if(!st.customFields.length)delete st.customFields;
      S.settings=st;save();keepForm(render);
    };
    const patchField=(st,k,fn)=>{const o={...(st.fields[k]||{})};fn(o);st.fields[k]=o};
    document.querySelectorAll('[data-fshow]').forEach(el=>el.onchange=()=>edit(st=>patchField(st,el.dataset.fshow,o=>{if(el.checked)delete o.show;else o.show=false})));
    document.querySelectorAll('[data-flabel]').forEach(el=>el.onchange=()=>edit(st=>patchField(st,el.dataset.flabel,o=>{const v=el.value.trim();if(!v||v===BUILTIN_FIELDS[el.dataset.flabel].label)delete o.label;else o.label=v})));
    document.querySelectorAll('[data-cflabel]').forEach(el=>el.onchange=()=>{
      const i=+el.dataset.cflabel,v=el.value.trim(),cur=customFields()[i];
      if(!v||customFields().some((c,j)=>j!==i&&slug(c.label)===slug(v))){toast(v?`“${v}” is already one of your fields`:'A field needs a name');el.value=cur.label;return}
      edit(st=>{
        const c=st.customFields[i];c.label=v;
        // A field still carrying its automatic name (new_field) gets a key from its real name, unless a card description already uses the old key.
        const nk=slug(v),mentioned=new RegExp('\\{[#/]?'+c.key+'[|}]').test(cfg().cardDesc);
        if(/^new_field(_\d+)?$/.test(c.key)&&!mentioned&&/^[a-z][a-z0-9_]{0,30}$/.test(nk)&&!RESERVED_KEYS.has(nk)&&!st.customFields.some((x,j)=>j!==i&&x.key===nk)){
          S.stories.forEach(x=>{if(x.extra&&c.key in x.extra){x.extra[nk]=x.extra[c.key];delete x.extra[c.key]}});
          c.key=nk;
        }
      });
    });
    document.querySelectorAll('[data-cftype]').forEach(el=>el.onchange=()=>edit(st=>{
      const c=st.customFields[+el.dataset.cftype];c.type=el.value;
      if(c.type==='choice'){if(!c.options||!c.options.length)c.options=['Option 1','Option 2']}else delete c.options;
    }));
    document.querySelectorAll('[data-cfopts]').forEach(el=>el.onchange=()=>{
      const i=+el.dataset.cfopts,o=[...new Set(el.value.split(',').map(x=>x.trim().slice(0,40)).filter(Boolean))].slice(0,20);
      if(!o.length){toast('A choice field needs at least one choice');el.value=(customFields()[i].options||[]).join(', ');return}
      edit(st=>{st.customFields[i].options=o});
    });
    document.querySelectorAll('[data-cfup]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cfup;edit(st=>{[st.customFields[i-1],st.customFields[i]]=[st.customFields[i],st.customFields[i-1]]})});
    document.querySelectorAll('[data-cfdown]').forEach(b=>b.onclick=()=>{const i=+b.dataset.cfdown;edit(st=>{[st.customFields[i+1],st.customFields[i]]=[st.customFields[i],st.customFields[i+1]]})});
    document.querySelectorAll('[data-cfdel]').forEach(b=>b.onclick=async()=>{
      const i=+b.dataset.cfdel,c=customFields()[i],used=S.stories.filter(x=>x.extra&&x.extra[c.key]);
      if(!await ask(`Delete “${c.label}”?`,used.length?`${used.length} stor${used.length===1?'y has':'ies have'} a value in it. The value${used.length===1?' is':'s are'} removed from ${used.length===1?'it':'them'}. Cards already on Trello are not touched.`:'The field is removed.',{ok:'Delete',danger:true}))return;
      used.forEach(x=>{delete x.extra[c.key];if(!Object.keys(x.extra).length)delete x.extra});
      edit(st=>{st.customFields.splice(i,1)});
    });
    $('#cf-add').onclick=()=>edit(st=>{
      let key='new_field',n=2;while(RESERVED_KEYS.has(key)||st.customFields.some(c=>c.key===key||slug(c.label)===key))key='new_field_'+n++;
      st.customFields.push({key,label:key==='new_field'?'New field':'New field '+(n-1),type:'text'});
    });
    $('#fields-reset').onclick=async()=>{
      const have=S.stories.filter(x=>x.extra&&Object.keys(x.extra).length).length;
      if(!await ask('Reset the story fields?',have?`All built-in fields come back and your own fields are removed, along with their values in ${have} stor${have===1?'y':'ies'}.`:'All built-in fields come back and your own fields are removed.',{ok:'Reset',danger:true}))return;
      S.stories.forEach(x=>delete x.extra);
      const next={...(S.settings||{})};delete next.fields;delete next.customFields;S.settings=next;save();keepForm(render);
    };
  }
  if($('#dt-reset')){
    document.querySelectorAll('[data-dt]').forEach(el=>el.onchange=()=>{
      const k=el.dataset.dt;let v=el.value;
      if(k==='dueTime'&&!/^([01]\d|2[0-3]):[0-5]\d$/.test(v)){toast('Pick a time, like 17:00');el.value=datesCfg().dueTime;return}
      const d={...datesCfg(),[k]:v},o={};
      for(const x of Object.keys(DATES_DEFAULTS))if(d[x]!==DATES_DEFAULTS[x])o[x]=d[x];
      const next={...(S.settings||{})};if(Object.keys(o).length)next.dates=o;else delete next.dates;
      S.settings=next;save();keepForm(render);
    });
    $('#dt-reset').onclick=()=>{const next={...(S.settings||{})};delete next.dates;S.settings=next;save();keepForm(render)};
  }
  if($('#card-title')){
    const sample=()=>S.stories[0]||{id:nextId(),title:'Log in with UNIMAS email',role:'a student',want:'to log in with my email',why:'my data stays private',ac:'Given a valid account, when I log in, then I see Home in 2 seconds\nGiven a wrong password, when I log in, then I see an error',points:'5',pri:defPri('form'),owner:'Aina',tasks:'',list:'',due:''};
    const prev=()=>{
      const t=$('#card-title').value,d=$('#card-desc').value,st=sample(),bad=titleProblem(t),unk=unknownFields(t+'\n'+d);
      $('#card-prev').textContent=renderTitle(t,st)+'\n\n'+renderDesc(d,storyVals(st));
      const w=$('#card-warn');w.textContent=[bad,unk.length?`Not a known field: ${unk.map(x=>'{'+x+'}').join(', ')}. It will show as typed.`:''].filter(Boolean).join(' ');w.hidden=!w.textContent;
    };
    $('#card-title').oninput=prev;$('#card-desc').oninput=prev;prev();
    const commit=()=>{
      const t=$('#card-title').value.trim(),bad=titleProblem(t);
      if(bad){toast(bad);keepForm(render);return}
      const d=$('#card-desc').value.replace(/\s+$/,''),cl=$('#card-cl').value.trim();
      const next={...(S.settings||{}),cardTitle:t,cardDesc:d||DEFAULT_DESC,checklistName:cl||CARD_DEFAULTS.checklistName};
      ['cardTitle','cardDesc','checklistName'].forEach(k=>{if(next[k]===CARD_DEFAULTS[k])delete next[k]});
      S.settings=next;save();keepForm(render);
    };
    $('#card-title').onchange=commit;$('#card-desc').onchange=commit;$('#card-cl').onchange=commit;
    $('#card-reset').onclick=async()=>{
      if(!await ask('Reset the card format?','The title, the description and the checklist name go back to the default. Cards already on Trello are not touched.',{ok:'Reset',danger:true}))return;
      const next={...(S.settings||{})};['cardTitle','cardDesc','checklistName'].forEach(k=>delete next[k]);
      S.settings=next;save();keepForm(render);
    };
  }
  if($('#tpl'))$('#tpl').onclick=e=>copy(templateText(),e.currentTarget,'Template copied. Give it to your AI assistant with your notes.');
  document.querySelectorAll('[data-chip]').forEach(b=>b.onclick=()=>{const f=$('#f-list');f.value=b.dataset.chip;f.focus()});
  if($('#cancel'))$('#cancel').onclick=()=>{editing=null;render()};
  if($('#save'))$('#save').onclick=async()=>{
    const old=editing!==null?S.stories[editing]:{};
    // A hidden field has no input on the page: the story keeps what it has.
    const v=k=>{const e=$('#f-'+k);return e?e.value.trim():String(old[k]??'')};
    const raw=k=>{const e=$('#f-'+k);return e?e.value:String(old[k]??'')};
    if(!v('title')){toast('Give the story a title');$('#f-title').focus();return}
    const d={title:v('title'),role:v('role'),want:v('want'),why:v('why'),ac:raw('ac'),points:v('points'),pri:v('pri'),tasks:raw('tasks'),owner:v('owner'),list:v('list'),due:v('due')};
    const extra={...(old.extra||{})};
    for(const c of customFields()){
      const e=$('#f-x-'+c.key);if(!e)continue;
      const val=cleanExtra(c,e.value);
      if(val===null){toast(`“${c.label}” does not fit: ${c.type==='number'?'use a number':c.type==='date'?'use a date':'pick one of the choices'}`);e.focus();return}
      if(val)extra[c.key]=val;else delete extra[c.key];
    }
    if(Object.keys(extra).length||old.extra)d.extra=extra;
    const own=v('id').toUpperCase(),locked=editing!==null&&!!S.stories[editing].cardId;
    if(own&&!locked){
      if(!ID_OK.test(own)){toast('An ID looks like FR-03 or FR-AI-01: letters, then a dash and a number');$('#f-id').focus();return}
      if(idTaken(own,editing)){toast(`${own} is already used by another story`);$('#f-id').focus();return}
    }
    const same=S.stories.find((x,i)=>i!==editing&&x.title.trim().toLowerCase()===d.title.toLowerCase());
    if(same&&!await ask('Add it again?',`A story called “${same.title}” already exists as ${same.id}.`,{ok:'Add anyway'}))return;
    if(editing!==null){Object.assign(S.stories[editing],d);if(own&&!locked)S.stories[editing].id=own}
    else S.stories.push({...d,id:own||nextId()});
    editing=null;save();render();toast(`Saved “${d.title}”`);scrollTo(0,0);
  };
}
const THEME_KEY='sprintkit.theme',THEMES=['auto','light','dark'];
let theme='auto';try{theme=localStorage.getItem(THEME_KEY)||'auto'}catch(e){}
function applyTheme(){const t=theme;
  if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
  $('#theme').textContent='Theme: '+t[0].toUpperCase()+t.slice(1)}
$('#theme').onclick=()=>{theme=THEMES[(THEMES.indexOf(theme)+1)%THEMES.length];try{localStorage.setItem(THEME_KEY,theme)}catch(e){}applyTheme()};
applyTheme();
// Stop the background drifting while the window is hidden
document.addEventListener('visibilitychange',()=>document.documentElement.classList.toggle('idle',document.hidden));
// Updates (desktop app only): look for a newer signed version on GitHub
const UPD=window.__TAURI__&&window.__TAURI__.updater;
let found=null,installing=false;
function updBanner(html){const e=$('#upd');e.innerHTML=html;e.hidden=!html}
async function checkUpdate(manual){
  if(!UPD||installing)return;
  if(manual)updBanner('Checking for updates...');
  try{
    found=await UPD.check();
    if(found){
      updBanner(`<b>Version ${esc(found.version)} is available.</b> <button class="btn p" id="upd-go">Update now</button> <button class="btn link" id="upd-later">Later</button>`);
      $('#upd-go').onclick=installUpdate;$('#upd-later').onclick=()=>updBanner('');
    }else if(manual){updBanner('You have the latest version.');setTimeout(()=>{if(!installing)updBanner('')},4000)}
    else updBanner('');
  }catch(e){updBanner(manual?'Could not check for updates: '+esc(String(e)):'')}
}
async function installUpdate(){
  installing=true;let total=0,got=0;updBanner('Downloading the update...');
  try{
    await found.downloadAndInstall(ev=>{
      if(ev.event==='Started')total=ev.data.contentLength||0;
      else if(ev.event==='Progress'){got+=ev.data.chunkLength;updBanner('Downloading the update'+(total?` (${Math.round(got/total*100)}%)`:'')+'...')}
      else if(ev.event==='Finished')updBanner('Installing. The app will close and open again by itself.');
    });
  }catch(e){installing=false;updBanner('The update failed: '+esc(String(e))+' <button class="btn link" id="upd-retry">Try again</button>');$('#upd-retry').onclick=()=>checkUpdate(true)}
}
function initUpdates(){
  if(!UPD)return;
  $('#chk').hidden=false;$('#chk').onclick=()=>checkUpdate(true);
  try{window.__TAURI__.app.getVersion().then(v=>{$('#ver').textContent='Version '+v})}catch(e){}
  checkUpdate(false);
}
initSecure();
initUpdates();
// In the desktop (Tauri) app, open external links in the default browser
document.addEventListener('click',e=>{
  const a=e.target.closest('a[href^="http"]');
  if(a&&window.__TAURI__&&window.__TAURI__.opener){e.preventDefault();window.__TAURI__.opener.openUrl(a.href)}
});
$('#goSetup').onclick=()=>{settingsTab='board';page='settings';render();scrollTo(0,0)};
$('#settingsBtn').onclick=()=>{page='settings';render();scrollTo(0,0)};
const importStories=e=>{
  const input=e.target,f=input.files[0];
  if(!f)return;
  const bad=()=>ask('Not a valid stories file','Choose a file you saved with Save stories to a file.',{ok:'OK',cancel:''});
  f.text().then(async text=>{
    let d;
    try{d=JSON.parse(text)}catch(x){return bad()}
    if(!d||!Array.isArray(d.stories)||d.stories.some(s=>!s||typeof s!=='object'||typeof s.title!=='string'))return bad();
    const n=d.stories.length;
    if(S.stories.length&&!await ask('Replace your stories?',`This loads ${n} stor${n===1?'y':'ies'} from the file and replaces the ${S.stories.length} you have now.`,{ok:'Replace',danger:true}))return;
    S={review:typeof d.review==='string'?d.review:'',stories:[],settings:cleanSettings(d.settings)};
    const blank={role:'',want:'',why:'',ac:'',points:'',pri:defPri('bulk'),tasks:'',owner:'',list:''};
    const goodExtra=e=>{if(!e||typeof e!=='object'||Array.isArray(e))return undefined;const o={};for(const [k,val] of Object.entries(e))if(/^[a-z][a-z0-9_]{0,30}$/.test(k)&&typeof val==='string'&&val.length<=2000)o[k]=val;return Object.keys(o).length?o:undefined};
    d.stories.forEach(s=>{const one={...blank,...s,id:typeof s.id==='string'?s.id:''},ex=goodExtra(s.extra);if(ex)one.extra=ex;else delete one.extra;S.stories.push(one)});
    S.stories.forEach(s=>{if(!s.id)s.id=nextId()});
    editing=null;save();page='write';render();toast(`Loaded ${n} stor${n===1?'y':'ies'}`);
  }).finally(()=>{input.value=''});
};
render();
</script>
